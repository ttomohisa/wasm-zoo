name: Test upstream candidate

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Package slug
        required: true
        type: choice
        options: [ffmpeg, libarchive, imagemagick, ghostscript, libvips, jq, qpdf, zstd]
      version:
        description: Upstream version
        required: true
        type: string
      ref:
        description: Upstream Git ref/tag
        required: true
        type: string
      commit:
        description: Resolved upstream commit SHA
        required: true
        type: string
      released:
        description: Upstream release/commit timestamp (ISO 8601)
        required: false
        type: string
      issue_number:
        description: Upstream watcher issue to comment on
        required: false
        type: string
      release_tag:
        description: Official release tag for source-archive-backed candidates
        required: false
        type: string
      source_url:
        description: Official source archive URL for source-archive-backed candidates
        required: false
        type: string
      source_sha256:
        description: Official source archive SHA-256 for source-archive-backed candidates
        required: false
        type: string
      adapter_bundle:
        description: Base64-encoded immutable libvips adapter bundle JSON
        required: false
        type: string

jobs:
  ffmpeg:
    if: inputs.slug == 'ffmpeg'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        profile: [browser-full, browser-full-gpl]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2.2.0
      - name: Prepare candidate pin
        run: node scripts/prepare-candidate.mjs --slug ffmpeg --version "${{ inputs.version }}" --ref "${{ inputs.ref }}" --commit "${{ inputs.commit }}"
      - name: Build candidate and run browser smoke test
        shell: bash
        working-directory: builders/ffmpeg
        env:
          FFMPEG_WASM_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          chmod +x ./build.sh ./scripts/*.sh
          ./build.sh "${{ matrix.profile }}"
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-ffmpeg-${{ inputs.version }}-${{ matrix.profile }}
          path: builders/ffmpeg/dist/${{ matrix.profile }}/
          retention-days: 14

  libarchive:
    if: inputs.slug == 'libarchive'
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2.2.0
      - name: Prepare candidate pin
        run: node scripts/prepare-candidate.mjs --slug libarchive --version "${{ inputs.version }}" --ref "${{ inputs.ref }}" --commit "${{ inputs.commit }}"
      - name: Build candidate and run browser smoke test
        shell: bash
        working-directory: builders/libarchive
        env:
          LIBARCHIVE_WASM_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          chmod +x ./build.sh ./scripts/*.sh
          ./build.sh browser-full
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-libarchive-${{ inputs.version }}-browser-full
          path: builders/libarchive/dist/browser-full/
          retention-days: 14

  imagemagick:
    if: inputs.slug == 'imagemagick'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2.2.0
      - name: Check ImageMagick shell syntax
        shell: bash
        run: |
          bash -n builders/imagemagick/build.sh builders/imagemagick/scripts/*.sh
      - name: Prepare candidate pin
        run: node scripts/prepare-candidate.mjs --slug imagemagick --version "${{ inputs.version }}" --ref "${{ inputs.ref }}" --commit "${{ inputs.commit }}"
      - name: Build candidate and run browser smoke test
        shell: bash
        working-directory: builders/imagemagick
        env:
          IMAGEMAGICK_WASM_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          chmod +x ./build.sh ./scripts/*.sh
          ./build.sh browser-full
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-imagemagick-${{ inputs.version }}-browser-full
          path: builders/imagemagick/dist/browser-full/
          retention-days: 14

  jq:
    if: inputs.slug == 'jq'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2.2.0
      - name: Check jq shell syntax
        shell: bash
        run: bash -n builders/jq/build.sh builders/jq/scripts/*.sh
      - name: Prepare candidate pin
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/prepare-candidate.mjs --slug jq --version "${{ inputs.version }}" --ref "${{ inputs.ref }}" --commit "${{ inputs.commit }}"
      - name: Build candidate and run browser smoke test
        shell: bash
        working-directory: builders/jq
        env:
          JQ_WASM_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          chmod +x ./build.sh ./scripts/*.sh
          ./build.sh browser-full
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-jq-${{ inputs.version }}-browser-full
          path: builders/jq/dist/browser-full/
          retention-days: 14


  ghostscript:
    if: inputs.slug == 'ghostscript'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2.2.0
      - name: Check Ghostscript shell syntax
        shell: bash
        run: bash -n builders/ghostscript/build.sh builders/ghostscript/scripts/*.sh
      - name: Prepare candidate pin and official source digest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/prepare-candidate.mjs
          --slug ghostscript
          --version "${{ inputs.version }}"
          --ref "${{ inputs.ref }}"
          --commit "${{ inputs.commit }}"
          --release-tag "${{ inputs.release_tag }}"
          --source-url "${{ inputs.source_url }}"
          --source-sha256 "${{ inputs.source_sha256 }}"
      - name: Build candidate and run browser smoke test
        shell: bash
        working-directory: builders/ghostscript
        env:
          GHOSTSCRIPT_WASM_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          chmod +x ./build.sh ./scripts/*.sh
          ./build.sh browser-full
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-ghostscript-${{ inputs.version }}-browser-full
          path: builders/ghostscript/dist/browser-full/
          retention-days: 14


  qpdf:
    if: inputs.slug == 'qpdf'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2.2.0
      - name: Check QPDF shell syntax
        shell: bash
        run: bash -n builders/qpdf/build.sh builders/qpdf/scripts/*.sh
      - name: Prepare candidate pin and official source digest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/prepare-candidate.mjs
          --slug qpdf
          --version "${{ inputs.version }}"
          --ref "${{ inputs.ref }}"
          --commit "${{ inputs.commit }}"
          --release-tag "${{ inputs.release_tag }}"
          --source-url "${{ inputs.source_url }}"
          --source-sha256 "${{ inputs.source_sha256 }}"
      - name: Build candidate and run real Chromium PDF smoke
        shell: bash
        working-directory: builders/qpdf
        env:
          QPDF_WASM_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          chmod +x ./build.sh ./scripts/*.sh
          ./build.sh browser-full
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-qpdf-${{ inputs.version }}-browser-full
          path: builders/qpdf/dist/browser-full/
          retention-days: 14

  zstd:
    if: inputs.slug == 'zstd'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        profile: [browser-core, browser-full]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2.2.0
      - name: Install native zstd for mandatory browser-full interoperability
        if: matrix.profile == 'browser-full'
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          zstd --version
      - name: Prepare isolated exact-tag candidate and exact-version assertions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/prepare-candidate.mjs --slug zstd --version "${{ inputs.version }}" --ref "${{ inputs.ref }}" --commit "${{ inputs.commit }}"
      - name: Build candidate and run real browser/native smoke
        shell: bash
        working-directory: builders/zstd
        env:
          ZSTD_WASM_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
          ZSTD_NATIVE_INTEROP: ${{ matrix.profile == 'browser-full' && 'required' || '' }}
        run: |
          chmod +x ./build.sh ./scripts/*.sh
          ./build.sh "${{ matrix.profile }}"
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-zstd-${{ inputs.version }}-${{ matrix.profile }}
          path: builders/zstd/dist/${{ matrix.profile }}/
          retention-days: 14


  libvips:
    if: inputs.slug == 'libvips'
    runs-on: ubuntu-latest
    timeout-minutes: 420
    strategy:
      fail-fast: false
      matrix:
        profile: [browser-core, browser-full]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2.2.0
      - name: Prepare immutable adapter-bundle candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ADAPTER_BUNDLE: ${{ inputs.adapter_bundle }}
        shell: bash
        run: |
          set -euo pipefail
          adapter_json="$(printf '%s' "$ADAPTER_BUNDLE" | base64 --decode)"
          node scripts/prepare-candidate.mjs \
            --slug libvips \
            --version "${{ inputs.version }}" \
            --ref "${{ inputs.ref }}" \
            --commit "${{ inputs.commit }}" \
            --emsdk-version "$(jq -r '.emsdkVersion' <<<"$adapter_json")" \
            --emscripten-ref "$(jq -r '.emscriptenRef' <<<"$adapter_json")" \
            --emscripten-commit "$(jq -r '.emscriptenCommit' <<<"$adapter_json")" \
            --wasm-vips-commit "$(jq -r '.adapterCommit' <<<"$adapter_json")" \
            --wasm-vips-version "$(jq -r '.adapterVersion' <<<"$adapter_json")" \
            --libvips-patch-commit "$(jq -r '.libvipsPatchCommit' <<<"$adapter_json")" \
            --emscripten-patch-commit "$(jq -r '.emscriptenPatchCommit' <<<"$adapter_json")"
      - name: Build candidate and run browser smoke test
        shell: bash
        working-directory: builders/libvips
        env:
          LIBVIPS_WASM_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          chmod +x ./build.sh ./scripts/*.sh
          ./build.sh "${{ matrix.profile }}"
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-libvips-${{ inputs.version }}-${{ matrix.profile }}
          path: builders/libvips/dist/${{ matrix.profile }}/
          retention-days: 14

  report:
    if: always()
    needs: [ffmpeg, libarchive, imagemagick, ghostscript, libvips, jq, qpdf, zstd]
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.result.outputs.result }}
    steps:
      - name: Build candidate result
        id: result
        shell: bash
        run: |
          slug='${{ inputs.slug }}'
          case "$slug" in
            ffmpeg) result='${{ needs.ffmpeg.result }}' ;;
            libarchive) result='${{ needs.libarchive.result }}' ;;
            imagemagick) result='${{ needs.imagemagick.result }}' ;;
            ghostscript) result='${{ needs.ghostscript.result }}' ;;
            jq) result='${{ needs.jq.result }}' ;;
            qpdf) result='${{ needs.qpdf.result }}' ;;
            zstd) result='${{ needs.zstd.result }}' ;;
            libvips) result='${{ needs.libvips.result }}' ;;
            *) result='unknown' ;;
          esac
          echo "result=$result" >> "$GITHUB_OUTPUT"
          {
            echo '## Upstream candidate result'
            echo
            echo "- Package: **${{ inputs.slug }}**"
            echo "- Candidate: **${{ inputs.version }}**"
            echo "- Ref: \`${{ inputs.ref }}\`"
            echo "- Commit: \`${{ inputs.commit }}\`"
            echo "- Result: **$result**"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on watcher issue
        if: inputs.issue_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.result.outputs.result }}
        shell: bash
        run: |
          body=$(cat <<EOF_BODY
          Candidate workflow finished for **${{ inputs.slug }} ${{ inputs.version }}**.

          - ref: \`${{ inputs.ref }}\`
          - commit: \`${{ inputs.commit }}\`
          - result: **${RESULT}**
          - run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          For `auto` packages, a successful candidate is eligible for a review-only promotion PR. The automation never merges the PR, creates a release tag, or publishes a release. Packages without an automatic candidate contract retain their manual gate.
          EOF_BODY
          )
          gh issue comment "${{ inputs.issue_number }}" --repo "$GITHUB_REPOSITORY" --body "$body"

  promotion-pr:
    if: ${{ always() && needs.report.outputs.result == 'success' }}
    needs: [report]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Prepare review-only promotion changes
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ADAPTER_BUNDLE: ${{ inputs.adapter_bundle }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            node scripts/prepare-promotion.mjs
            --slug "${{ inputs.slug }}"
            --version "${{ inputs.version }}"
            --ref "${{ inputs.ref }}"
            --commit "${{ inputs.commit }}"
            --released "${{ inputs.released }}"
            --release-tag "${{ inputs.release_tag }}"
            --source-url "${{ inputs.source_url }}"
            --source-sha256 "${{ inputs.source_sha256 }}"
          )
          if [ "${{ inputs.slug }}" = "libvips" ]; then
            adapter_json="$(printf '%s' "$ADAPTER_BUNDLE" | base64 --decode)"
            args+=(
              --emsdk-version "$(jq -r '.emsdkVersion' <<<"$adapter_json")"
              --emscripten-ref "$(jq -r '.emscriptenRef' <<<"$adapter_json")"
              --emscripten-commit "$(jq -r '.emscriptenCommit' <<<"$adapter_json")"
              --wasm-vips-commit "$(jq -r '.adapterCommit' <<<"$adapter_json")"
              --wasm-vips-version "$(jq -r '.adapterVersion' <<<"$adapter_json")"
              --libvips-patch-commit "$(jq -r '.libvipsPatchCommit' <<<"$adapter_json")"
              --emscripten-patch-commit "$(jq -r '.emscriptenPatchCommit' <<<"$adapter_json")"
            )
          fi
          "${args[@]}"
      - name: Regenerate and validate reviewed metadata
        shell: bash
        run: |
          set -euo pipefail
          npm run catalog
          npm run check
          npm run metadata:check
          case "${{ inputs.slug }}" in
            ffmpeg) node builders/ffmpeg/scripts/check-repository.mjs ;;
            libarchive) node builders/libarchive/scripts/check-repository.mjs ;;
            imagemagick) node builders/imagemagick/scripts/check-repository.mjs ;;
            ghostscript) node builders/ghostscript/scripts/check-repository.mjs ;;
            libvips) node builders/libvips/scripts/check-repository.mjs ;;
            jq) node builders/jq/scripts/check-repository.mjs ;;
            qpdf) node builders/qpdf/scripts/check-repository.mjs ;;
            zstd) node builders/zstd/scripts/check-repository.mjs ;;
            *) echo "automatic promotion is not supported for ${{ inputs.slug }}" >&2; exit 1 ;;
          esac
          git diff --check
      - name: Create or reuse promotion PR
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          slug="${{ inputs.slug }}"
          version="${{ inputs.version }}"
          builder="${{ steps.prepare.outputs.builder_version }}"
          issue="${{ inputs.issue_number }}"
          safe_version="$(tr -cs 'A-Za-z0-9._-' '-' <<<"$version" | sed 's/^-//;s/-$//')"
          branch="automation/promote-${slug}-${safe_version}"

          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$branch" --json url --jq '.[0].url // empty')"
          if [ -n "$existing" ]; then
            echo "[promotion] reusing existing PR: $existing"
            echo "url=$existing" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet; then
            echo "[promotion] no changes remain; candidate may already be promoted"
            echo "url=" >> "$GITHUB_OUTPUT"
            echo "branch=" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            branch="${branch}-run-${GITHUB_RUN_ID}"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "chore(${slug}): promote ${version} to builder ${builder}"
          git push -u origin "$branch"

          body_file="$(mktemp)"
          {
            echo "## Summary"
            echo
            echo "- promote **${slug}** to upstream **${version}**"
            echo "- update the reviewed exact source pin to \`${{ inputs.commit }}\`"
            echo "- bump the package builder to **${builder}**"
            echo "- regenerate package/catalog/release metadata"
            if [ -n "$issue" ]; then
              echo
              echo "Refs #${issue}"
            fi
            echo
            echo "## Candidate gate"
            echo
            echo "The isolated upstream candidate build and browser smoke test passed before this PR was generated."
            echo
            echo "Candidate run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "## Safety"
            echo
            echo "This PR is review-only. Automation does **not** merge it, create a release tag, or publish a release."
            echo "Repository validation and the package build workflow are dispatched explicitly below because this PR is created with the repository GITHUB_TOKEN."
          } > "$body_file"

          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "chore(${slug}): promote ${version} to builder ${builder}" --body-file "$body_file")"
          rm -f "$body_file"
          echo "[promotion] created $pr_url"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"
      - name: Dispatch promotion CI
        if: steps.pr.outputs.url != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="${{ steps.pr.outputs.branch }}"
          gh workflow run verify.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          gh workflow run "build-${{ inputs.slug }}.yml" --repo "$GITHUB_REPOSITORY" --ref "$branch"
          echo "[promotion] dispatched Verify catalog + build-${{ inputs.slug }}.yml on $branch"
      - name: Comment promotion PR on watcher issue
        if: inputs.issue_number != '' && steps.pr.outputs.url != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(cat <<EOF_BODY
          Review-only promotion PR: ${{ steps.pr.outputs.url }}

          - upstream: **${{ inputs.version }}**
          - commit: \`${{ inputs.commit }}\`
          - builder: **${{ steps.prepare.outputs.builder_version }}**
          - validation: `Verify catalog` and `build-${{ inputs.slug }}.yml` dispatched on the promotion branch

          Merge, release tag and publication remain manual.
          EOF_BODY
          )
          gh issue comment "${{ inputs.issue_number }}" --repo "$GITHUB_REPOSITORY" --body "$body"
      - name: Add promotion summary
        if: steps.pr.outputs.url != ''
        shell: bash
        run: |
          {
            echo "## Promotion PR"
            echo
            echo "- PR: ${{ steps.pr.outputs.url }}"
            echo "- Branch: \`${{ steps.pr.outputs.branch }}\`"
            echo "- Builder: \`${{ steps.prepare.outputs.builder_version }}\`"
            echo "- Merge/tag/release: **manual**"
          } >> "$GITHUB_STEP_SUMMARY"
