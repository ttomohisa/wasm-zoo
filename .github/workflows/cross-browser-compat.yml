name: Cross-browser compatibility lab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'VERSION'
      - 'scripts/lib.mjs'
      - 'scripts/browser-compatibility-snapshot.mjs'
      - 'scripts/npm-package-set.mjs'
      - 'scripts/publish-browser-compatibility.mjs'
      - 'scripts/smoke-npm-package.mjs'
      - 'scripts/threaded-browser-capabilities.mjs'
      - 'scripts/test-threaded-browser-capabilities.mjs'
      - 'scripts/report-threaded-compatibility.mjs'
      - 'scripts/check-npm-distribution.mjs'
      - '.github/workflows/cross-browser-compat.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/lib.mjs'
      - 'scripts/browser-compatibility-snapshot.mjs'
      - 'scripts/npm-package-set.mjs'
      - 'scripts/publish-browser-compatibility.mjs'
      - 'scripts/smoke-npm-package.mjs'
      - 'scripts/threaded-browser-capabilities.mjs'
      - 'scripts/test-threaded-browser-capabilities.mjs'
      - 'scripts/report-threaded-compatibility.mjs'
      - 'scripts/check-npm-distribution.mjs'
      - '.github/workflows/cross-browser-compat.yml'
  schedule:
    - cron: '41 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  package-set:
    name: Resolve published npm package matrix
    runs-on: ubuntu-24.04
    outputs:
      all: ${{ steps.packages.outputs.all }}
      single: ${{ steps.packages.outputs.single }}
      threaded: ${{ steps.packages.outputs.threaded }}
      count: ${{ steps.packages.outputs.count }}
      deferred: ${{ steps.packages.outputs.deferred }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Derive package sets from reviewed manifests
        id: packages
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            node scripts/npm-package-set.mjs --github-output --registry-ready
          else
            node scripts/npm-package-set.mjs --github-output
          fi
      - name: Validate shared browser batch and threaded policy
        run: |
          node --check scripts/smoke-npm-package.mjs
          node --check scripts/run-browser-compatibility-batch.mjs
          node --test scripts/test-browser-compatibility-batch.mjs
          node --test scripts/test-threaded-browser-capabilities.mjs
      - name: Summarize prepublication Registry deferrals
        if: ${{ steps.packages.outputs.deferred != '[]' }}
        env:
          DEFERRED: ${{ steps.packages.outputs.deferred }}
        shell: bash
        run: |
          {
            echo '### npm Registry versions deferred on this pull request'
            echo
            printf '%s\n' "- Exact versions not public yet: ${DEFERRED}"
            echo '- Only exact-version 404 responses are deferred; other Registry failures fail closed.'
            echo '- Push/main, schedule and manual runs continue to require the complete reviewed package set.'
          } >> "$GITHUB_STEP_SUMMARY"

  browser:
    name: All reviewed packages / ${{ matrix.browser }}
    needs: [package-set]
    if: ${{ needs.package-set.outputs.all != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require current npm CLI
        run: npm install --global npm@12.0.2
      - name: Install Playwright browser once for this job
        run: npx -y playwright@1.63.0 install --with-deps '${{ matrix.browser }}'
      - name: Run every reviewed package operation with the shared browser install
        env:
          PACKAGE_SLUGS: ${{ needs.package-set.outputs.all }}
        shell: bash
        run: |
          node scripts/run-browser-compatibility-batch.mjs \
            --slugs-json "$PACKAGE_SLUGS" \
            --browser '${{ matrix.browser }}' \
            --result-dir compat-results
      - name: Upload all per-package compatibility records for this browser
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.browser }}-compatibility
          path: compat-results/*.json
          if-no-files-found: warn
          retention-days: 30

  threaded-report:
    name: Enforce observed threaded compatibility classifications
    runs-on: ubuntu-24.04
    needs: [package-set, browser]
    if: ${{ always() && needs.package-set.outputs.threaded != '[]' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-*-compatibility
          path: compat-results
          merge-multiple: true
      - name: Verify every threaded result and summarize observed support
        env:
          THREADED_TARGETS: ${{ needs.package-set.outputs.threaded }}
        run: node scripts/report-threaded-compatibility.mjs compat-results --targets-json "$THREADED_TARGETS"
      - name: Upload aggregate compatibility record
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: threaded-compatibility-aggregate
          path: compat-results/threaded-aggregate.json
          if-no-files-found: warn
          retention-days: 30
