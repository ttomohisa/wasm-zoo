name: Cross-browser compatibility lab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'VERSION'
      - 'package.json'
      - '.github/workflows/cross-browser-compat.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'VERSION'
      - 'package.json'
      - 'README.md'
      - 'site/**'
      - 'packages/**'
      - 'scripts/browser-compatibility-snapshot.mjs'
      - 'scripts/npm-package-set.mjs'
      - 'scripts/publish-browser-compatibility.mjs'
      - 'scripts/test-browser-compatibility-snapshot.mjs'
      - 'scripts/smoke-npm-package.mjs'
      - 'scripts/threaded-browser-capabilities.mjs'
      - 'scripts/test-threaded-browser-capabilities.mjs'
      - 'scripts/report-threaded-compatibility.mjs'
      - 'scripts/check-npm-distribution.mjs'
      - '.github/workflows/cross-browser-compat.yml'
      - 'docs/CROSS_BROWSER_LAB.md'
  schedule:
    - cron: '41 3 * * 1'

permissions:
  contents: read

jobs:
  package-set:
    name: Resolve published npm package matrix
    runs-on: ubuntu-24.04
    outputs:
      single: ${{ steps.packages.outputs.single }}
      threaded: ${{ steps.packages.outputs.threaded }}
      count: ${{ steps.packages.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Derive package sets from reviewed manifests
        id: packages
        run: node scripts/npm-package-set.mjs --github-output

  single-threaded:
    name: ${{ matrix.slug }} / ${{ matrix.browser }}
    needs: [package-set]
    if: ${{ needs.package-set.outputs.single != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slug: ${{ fromJSON(needs.package-set.outputs.single) }}
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require current npm CLI
        run: npm install --global npm@12.0.2
      - name: Check shared smoke runner syntax
        run: node --check scripts/smoke-npm-package.mjs
      - name: Test published package in Vite production build
        env:
          WASM_ZOO_PLAYWRIGHT_WITH_DEPS: '1'
        run: >
          node scripts/smoke-npm-package.mjs
          --slug '${{ matrix.slug }}'
          --browser '${{ matrix.browser }}'
          --result-json 'compat-results/${{ matrix.slug }}-${{ matrix.browser }}.json'
      - name: Upload per-browser compatibility result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}-${{ matrix.browser }}-compatibility
          path: compat-results/${{ matrix.slug }}-${{ matrix.browser }}.json
          if-no-files-found: warn
          retention-days: 30

  threaded:
    name: ${{ matrix.slug }} / ${{ matrix.browser }} (threaded)
    needs: [package-set]
    if: ${{ needs.package-set.outputs.threaded != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slug: ${{ fromJSON(needs.package-set.outputs.threaded) }}
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require current npm CLI
        run: npm install --global npm@12.0.2
      - name: Check shared smoke runner and preflight tests
        run: |
          node --check scripts/smoke-npm-package.mjs
          node --test scripts/test-threaded-browser-capabilities.mjs
      - name: Test published threaded package with runtime preflight
        env:
          WASM_ZOO_PLAYWRIGHT_WITH_DEPS: '1'
        run: >
          node scripts/smoke-npm-package.mjs
          --slug '${{ matrix.slug }}'
          --browser '${{ matrix.browser }}'
          --on-unsupported '${{ matrix.browser == 'chromium' && 'error' || 'record' }}'
          --result-json 'compat-results/${{ matrix.slug }}-${{ matrix.browser }}.json'
      - name: Upload per-browser threaded compatibility result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: threaded-${{ matrix.slug }}-${{ matrix.browser }}-compatibility
          path: compat-results/${{ matrix.slug }}-${{ matrix.browser }}.json
          if-no-files-found: warn
          retention-days: 30

  threaded-report:
    name: Enforce observed threaded compatibility classifications
    runs-on: ubuntu-24.04
    needs: [package-set, threaded]
    if: ${{ always() && needs.package-set.outputs.threaded != '[]' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          pattern: threaded-*-compatibility
          path: compat-results
          merge-multiple: true
      - name: Verify every threaded result and summarize observed support
        run: node scripts/report-threaded-compatibility.mjs compat-results
      - name: Upload aggregate compatibility record
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: threaded-compatibility-aggregate
          path: compat-results/threaded-aggregate.json
          if-no-files-found: warn
          retention-days: 30
