name: Watch upstream releases

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: upstream-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Generate upstream status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-upstream.mjs --json --write-site > upstream-report.json
      - name: Add compact report to job summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-upstream.mjs --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Refresh release health and add summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-release-health.mjs --write-site
          node scripts/check-release-health.mjs --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Publish freshness snapshot when it changed
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- site/upstream-status.json site/release-health.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/upstream-status.json site/release-health.json
          git commit -m "chore: refresh distribution health"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Refresh GitHub Pages after snapshot
        if: steps.snapshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY"
      - name: Open per-package issues and dispatch first candidate check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -c '.packages[] | select(.status == "ok" and .updateAvailable == true)' upstream-report.json | while read -r item; do
            slug="$(jq -r '.slug' <<<"$item")"
            name="$(jq -r '.name' <<<"$item")"
            pinned="$(jq -r '.pinned' <<<"$item")"
            latest="$(jq -r '.latest' <<<"$item")"
            ref="$(jq -r '.latestRef' <<<"$item")"
            commit="$(jq -r '.latestCommit' <<<"$item")"
            url="$(jq -r '.url' <<<"$item")"
            mode="$(jq -r '.candidate.mode' <<<"$item")"
            release_tag="$(jq -r '.candidate.source.releaseTag // ""' <<<"$item")"
            source_url="$(jq -r '.candidate.source.sourceUrl // ""' <<<"$item")"
            source_sha256="$(jq -r '.candidate.source.sourceSha256 // ""' <<<"$item")"
            lag="$(jq -r '.lagDays' <<<"$item")"
            released="$(jq -r '.latestReleased // ""' <<<"$item")"
            title="[upstream] ${name} ${latest} detected"
            issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "${title} in:title" --json number,title | jq -r --arg t "$title" '.[] | select(.title == $t) | .number' | head -n1)"
            existing_issue="$issue"
            body_file="$(mktemp)"
            cat > "$body_file" <<EOF_BODY
          A newer upstream release was detected by the WASM Zoo watcher.

          | Field | Value |
          | --- | --- |
          | Project | ${name} |
          | Zoo pin | ${pinned} |
          | Upstream | ${latest} |
          | Ref | \`${ref}\` |
          | Commit | \`${commit}\` |
          | Release-age gap | ${lag} day(s) |
          | Candidate mode | ${mode} |
          | Candidate source archive | \`${source_url:-n/a}\` |
          | Candidate source SHA-256 | \`${source_sha256:-n/a}\` |

          Upstream: ${url}

          The watcher never changes the reviewed Zoo pin on main automatically. For `auto` candidates, a successful isolated candidate build opens a review-only promotion PR and dispatches the normal repository/build checks; merge, release tag and publication remain manual. `adapter-gated` / `none` candidates still require their existing manual gate.
          EOF_BODY
            if [ -n "$existing_issue" ]; then
              issue="$existing_issue"
              gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$body_file" >/dev/null
              echo "[issue] reusing #${issue} and refreshing metadata: ${title}"
            else
              issue_url="$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body_file")"
              issue="${issue_url##*/}"
              echo "[issue] created #${issue}: ${title}"
            fi
            rm -f "$body_file"

            candidate_activity="$(gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json comments | jq '[.comments[].body | select(test("Candidate workflow (dispatched by upstream watcher|finished)|Review-only promotion PR:"))] | length')"
            if [ "$candidate_activity" -gt 0 ]; then
              echo "[skip] issue #${issue} already has candidate/promotion activity"
              continue
            fi

            if [ "$mode" = "auto" ]; then
              gh workflow run upstream-candidate.yml --repo "$GITHUB_REPOSITORY" \
                -f slug="$slug" -f version="$latest" -f ref="$ref" -f commit="$commit" -f released="$released" -f issue_number="$issue" \
                -f release_tag="$release_tag" -f source_url="$source_url" -f source_sha256="$source_sha256"
              gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "Candidate workflow dispatched by upstream watcher for **${slug} ${latest}**. The candidate workflow will post its final result here." >/dev/null
              echo "[candidate] dispatched ${slug} ${latest} on issue #${issue}"
            elif [ "$mode" = "adapter-gated" ]; then
              gh workflow run upstream-candidate.yml --repo "$GITHUB_REPOSITORY" \
                -f slug="$slug" -f version="$latest" -f ref="$ref" -f commit="$commit" -f released="$released" -f issue_number="$issue"
              gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "Candidate workflow dispatched by upstream watcher for **${slug} ${latest}** (adapter-readiness mode). The candidate workflow will post its final result here." >/dev/null
              echo "[candidate] dispatched adapter-readiness report for ${slug} ${latest} on issue #${issue}"
            else
              echo "[candidate] automatic candidate disabled for ${slug}"
            fi
          done
