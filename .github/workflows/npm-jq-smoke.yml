name: Smoke published npm jq with Vite

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/smoke-npm-jq.mjs'
      - 'scripts/check-npm-distribution.mjs'
      - '.github/workflows/npm-jq-smoke.yml'
      - 'packages/jq/package.json'
      - 'package.json'
      - 'VERSION'
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require current npm CLI
        run: npm install --global npm@12.0.2
      - name: Install and run published package through Vite + Chromium
        env:
          WASM_ZOO_PLAYWRIGHT_WITH_DEPS: '1'
        run: node scripts/smoke-npm-jq.mjs
