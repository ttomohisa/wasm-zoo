name: Verify catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "site/**"
      - "scripts/**"
      - "docs/**"
      - "builders/**"
      - "package.json"
      - "VERSION"
      - ".github/workflows/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate catalog
        run: npm run catalog
      - name: Validate repository and package onboarding
        run: |
          npm run check
          node scripts/check-metadata-contract.mjs
      - name: Rehearse all review-only automatic promotions
        run: npm run promotion:rehearse
      - name: Ensure generated catalog is committed
        run: git diff --exit-code -- site/catalog.json
