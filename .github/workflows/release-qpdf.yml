name: Release QPDF WASM

on:
  push:
    tags:
      - "qpdf-v*.*.*"

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2.2.0
      - name: Verify release tag
        shell: bash
        working-directory: builders/qpdf
        run: |
          set -euo pipefail
          source ./versions.env
          test "${GITHUB_REF_NAME}" = "qpdf-v${BUILDER_VERSION}"
      - name: Static builder and reviewed-pin checks
        shell: bash
        run: |
          bash -n builders/qpdf/build.sh builders/qpdf/scripts/*.sh
          node builders/qpdf/scripts/check-repository.mjs
      - name: Build and smoke-test browser-full
        shell: bash
        working-directory: builders/qpdf
        env:
          QPDF_WASM_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          chmod +x ./build.sh ./scripts/*.sh
          ./build.sh browser-full
      - name: Prepare binary, corresponding source and checksum assets
        shell: bash
        working-directory: builders/qpdf
        run: ./scripts/prepare-release.sh
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source builders/qpdf/versions.env
          gh release create "${GITHUB_REF_NAME}" builders/qpdf/release/* \
            --verify-tag \
            --title "WASM Zoo · QPDF ${QPDF_VERSION} · browser build" \
            --notes "Unofficial current-upstream QPDF CLI build for browser WebAssembly. Built from the official QPDF ${QPDF_VERSION} release source archive with exact digest/tag/commit pins, Emscripten ${EMSDK_VERSION}, QPDF native crypto and the exact zlib/libjpeg inputs selected by the pinned Emscripten ports. The release includes corresponding source/build recipe, third-party notices, in-toto/SLSA provenance, CycloneDX 1.6 SBOM and SHA-256 checksums. Chromium smoke testing verifies a real one-page PDF through check, linearize, AES-256 encryption, decryption and final validation before publication."
      - name: Refresh Pages so the Playground stages this release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
