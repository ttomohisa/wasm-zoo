name: Release libarchive WASM

on:
  push:
    tags:
      - "libarchive-v*.*.*"

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2.2.0
      - name: Verify release tag
        shell: bash
        working-directory: builders/libarchive
        run: |
          set -euo pipefail
          source ./versions.env
          test "${GITHUB_REF_NAME}" = "libarchive-v${BUILDER_VERSION}"
      - name: Static builder checks
        run: node builders/libarchive/scripts/check-repository.mjs
      - name: Build and smoke-test browser-full
        shell: bash
        working-directory: builders/libarchive
        env:
          LIBARCHIVE_WASM_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          chmod +x ./build.sh ./scripts/*.sh
          ./build.sh browser-full
      - name: Prepare binary, source and checksum assets
        shell: bash
        working-directory: builders/libarchive
        run: ./scripts/prepare-release.sh "${GITHUB_REF_NAME}"
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source builders/libarchive/versions.env
          gh release create "${GITHUB_REF_NAME}" \
            builders/libarchive/release/* \
            --verify-tag \
            --title "WASM Zoo · libarchive ${LIBARCHIVE_REF#v} · browser build" \
            --notes "Unofficial upstream libarchive CLI builds for WebAssembly. Includes bsdtar, bsdcpio, bsdcat and bsdunzip, machine-readable build inventory, exact hashes and corresponding source/build recipe. The browser build passed a real Chromium ZIP/Deflate list + extraction smoke test before publication. Metadata-enabled releases also publish in-toto/SLSA provenance and a CycloneDX 1.6 SBOM."
      - name: Refresh Pages so the Playground stages this release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
