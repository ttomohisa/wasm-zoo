name: Package / distribute npm

on:
  workflow_dispatch:
    inputs:
      slug:
        description: npm distribution package
        required: true
        type: choice
        options: [jq, libarchive, imagemagick]
      mode:
        description: Pack only, bootstrap a brand-new package, or stage a new version
        required: true
        default: pack
        type: choice
        options: [pack, bootstrap, stage]

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Require current npm CLI
        run: npm install --global npm@12.0.2
      - name: Resolve reviewed release asset
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          slug='${{ inputs.slug }}'
          mode='${{ inputs.mode }}'
          node - <<'NODE' "$slug" "$mode" >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const slug = process.argv[2];
          const mode = process.argv[3];
          const pkg = JSON.parse(fs.readFileSync(`packages/${slug}/package.json`, 'utf8'));
          const profile = pkg.npm?.profile;
          const meta = pkg.profiles.find((entry) => entry.id === profile);
          if (!pkg.npm || !['canary', 'published'].includes(pkg.npm.status) || !meta) throw new Error(`${slug} is not an npm-enabled distribution package`);
          if (!['pack', 'bootstrap', 'stage'].includes(mode)) throw new Error(`Unsupported npm mode: ${mode}`);
          console.log(`tag=${pkg.release.tag}`);
          console.log(`asset=${meta.releaseAsset}`);
          console.log(`npm_name=${pkg.npm.package}`);
          console.log(`npm_version=${pkg.npm.version}`);
          NODE
      - name: Download immutable Zoo release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p npm-work/release
          gh release download '${{ steps.meta.outputs.tag }}' --repo "$GITHUB_REPOSITORY" \
            --pattern '${{ steps.meta.outputs.asset }}' --dir npm-work
          unzip -q "npm-work/${{ steps.meta.outputs.asset }}" -d npm-work/release
      - name: Prepare npm package
        run: node scripts/prepare-npm-package.mjs --slug '${{ inputs.slug }}' --input npm-work/release --output npm-work/package
      - name: Validate npm package contents
        run: |
          npm run npm:check
          mkdir -p npm-work/artifacts
          npm pack ./npm-work/package --json --ignore-scripts --pack-destination npm-work/artifacts | tee npm-work/npm-pack.json
      - uses: actions/upload-artifact@v7
        with:
          name: npm-${{ inputs.slug }}-${{ steps.meta.outputs.npm_version }}
          path: |
            npm-work/artifacts/*.tgz
            npm-work/npm-pack.json
          retention-days: 14
      - name: Guard brand-new package bootstrap
        if: inputs.mode == 'bootstrap'
        shell: bash
        run: |
          set -euo pipefail
          name='${{ steps.meta.outputs.npm_name }}'
          if npm view "$name" version >/dev/null 2>&1; then
            echo "$name already exists on the npm registry; bootstrap is forbidden. Use stage for future versions." >&2
            exit 1
          fi
      - name: Bootstrap brand-new public package
        if: inputs.mode == 'bootstrap'
        working-directory: npm-work/package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: npm publish --access public
      - name: Guard staged version
        if: inputs.mode == 'stage'
        shell: bash
        run: |
          set -euo pipefail
          name='${{ steps.meta.outputs.npm_name }}'
          version='${{ steps.meta.outputs.npm_version }}'
          npm view "$name" version >/dev/null 2>&1 || {
            echo "$name does not exist yet; staged publishing cannot bootstrap a brand-new npm package." >&2
            exit 1
          }
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already public; refusing to stage an existing version." >&2
            exit 1
          fi
      - name: Stage new version for maintainer review
        if: inputs.mode == 'stage'
        working-directory: npm-work/package
        run: npm stage publish
      - name: Summary
        shell: bash
        run: |
          {
            echo '## npm distribution'
            echo
            echo '- Package: `${{ steps.meta.outputs.npm_name }}@${{ steps.meta.outputs.npm_version }}`'
            echo '- Source release: `${{ steps.meta.outputs.tag }}` / `${{ steps.meta.outputs.asset }}`'
            echo '- Mode: `${{ inputs.mode }}`'
            if [[ '${{ inputs.mode }}' == 'bootstrap' ]]; then
              echo '- Authentication: temporary scope-limited npm bootstrap token + GitHub OIDC provenance'
              echo '- Bootstrap guard: direct publish is allowed only while the package name does not exist'
            elif [[ '${{ inputs.mode }}' == 'stage' ]]; then
              echo '- Authentication: npm Trusted Publisher (OIDC), no long-lived publish token'
              echo '- Publication state: staged only; maintainer 2FA approval is still required'
            else
              echo '- Registry write: none'
            fi
            echo '- Existing GitHub Release assets: unchanged'
          } >> "$GITHUB_STEP_SUMMARY"
