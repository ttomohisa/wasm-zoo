name: Build libarchive browser WASM

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "builders/libarchive/**"
      - "packages/libarchive/**"
      - ".github/workflows/build-libarchive.yml"
  pull_request:
    paths:
      - "builders/libarchive/**"
      - "packages/libarchive/**"
      - ".github/workflows/build-libarchive.yml"

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2.2.0
      - name: Static builder checks
        run: node builders/libarchive/scripts/check-repository.mjs
      - name: Build upstream archive CLIs and run browser smoke test
        shell: bash
        working-directory: builders/libarchive
        env:
          LIBARCHIVE_WASM_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          chmod +x ./build.sh ./scripts/*.sh
          ./build.sh browser-full
      - name: Show generated manifest
        run: cat builders/libarchive/dist/browser-full/manifest.json
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: wasm-zoo-libarchive-browser-full-${{ github.sha }}
          path: |
            builders/libarchive/dist/browser-full/*-core.js
            builders/libarchive/dist/browser-full/*-core.wasm
            builders/libarchive/dist/browser-full/manifest.json
            builders/libarchive/dist/browser-full/features.json
            builders/libarchive/dist/browser-full/provenance.json
            builders/libarchive/dist/browser-full/sbom.cdx.json
            builders/libarchive/dist/browser-full/libarchive-config.txt
            builders/libarchive/dist/browser-full/browser-libarchive.js
          if-no-files-found: error
          retention-days: 30
