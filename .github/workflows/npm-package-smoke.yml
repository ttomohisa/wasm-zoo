name: Smoke published npm package with Vite

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Published npm package to verify
        required: true
        default: jq
        type: string
  pull_request:
    paths:
      - 'scripts/smoke-npm-*.mjs'
      - 'scripts/check-npm-distribution.mjs'
      - 'scripts/prepare-npm-package.mjs'
      - '.github/workflows/npm-package-smoke.yml'
      - 'packages/**'
      - 'builders/**/runtime/**'
      - 'scripts/npm-package-set.mjs'
      - 'package.json'
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require current npm CLI
        run: npm install --global npm@12.0.2
      - name: Resolve published package smoke target
        id: target
        shell: bash
        run: |
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then
            echo 'slug=${{ inputs.slug }}' >> "$GITHUB_OUTPUT"
          elif [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            # npm-only PRs can point reviewed metadata at an exact version that is
            # intentionally not public until Trusted Publisher staging is approved.
            # Select the deterministic baseline only from exact Registry-ready versions.
            slug="$(node scripts/npm-package-set.mjs --registry-ready --baseline)"
            echo "slug=$slug" >> "$GITHUB_OUTPUT"
          else
            # Scheduled smoke must require the reviewed Registry state without deferral.
            slug="$(node scripts/npm-package-set.mjs --baseline)"
            echo "slug=$slug" >> "$GITHUB_OUTPUT"
          fi
      - name: Install and run published package through Vite + Chromium
        env:
          WASM_ZOO_PLAYWRIGHT_WITH_DEPS: '1'
        run: node scripts/smoke-npm-package.mjs --slug '${{ steps.target.outputs.slug }}'
