name: Deploy catalog to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "site/**"
      - "scripts/**"
      - "builders/ffmpeg/runtime/browser-ffmpeg.js"
      - "builders/libarchive/runtime/browser-libarchive.js"
      - "builders/imagemagick/runtime/browser-imagemagick.js"
      - "builders/libvips/runtime/browser-libvips.js"
      - "builders/ghostscript/runtime/browser-ghostscript.js"
      - "builders/jq/runtime/browser-jq.js"
      - "VERSION"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate and validate catalog
        run: |
          npm run catalog
          npm run check
      - name: Refresh live release health snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-release-health.mjs --write-site

      - name: Stage published FFmpeg release for Playground
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source builders/ffmpeg/versions.env
          tag="ffmpeg-v${BUILDER_VERSION}"
          version="${FFMPEG_REF#n}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "[WARN] ${tag} is not published yet; FFmpeg Playground assets will be staged after the release workflow completes."
            exit 0
          fi
          work="${RUNNER_TEMP}/wasm-zoo-pages-ffmpeg"
          rm -rf "$work" && mkdir -p "$work"
          for profile in browser-full browser-full-gpl; do
            asset="ffmpeg-${profile}-${version}-zoo-${BUILDER_VERSION}.zip"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$work"
            dest="site/assets/ffmpeg/${version}/${profile}"
            mkdir -p "$dest"
            unzip -q -j "$work/$asset" ffmpeg-core.js ffmpeg-core.wasm manifest.json features.json -d "$dest"
            cp builders/ffmpeg/runtime/browser-ffmpeg.js "$dest/browser-ffmpeg.js"
          done
          echo "[OK] staged FFmpeg ${version} ${tag}"

      - name: Stage published libarchive release for Playground
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source builders/libarchive/versions.env
          tag="libarchive-v${BUILDER_VERSION}"
          version="${LIBARCHIVE_REF#v}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "[WARN] ${tag} is not published yet; libarchive Playground assets will be staged after the release workflow completes."
            exit 0
          fi
          work="${RUNNER_TEMP}/wasm-zoo-pages-libarchive"
          rm -rf "$work" && mkdir -p "$work"
          asset="libarchive-browser-full-${version}-zoo-${BUILDER_VERSION}.zip"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$work"
          dest="site/assets/libarchive/${version}/browser-full"
          mkdir -p "$dest"
          unzip -q -j "$work/$asset" \
            bsdtar-core.js bsdtar-core.wasm \
            bsdcpio-core.js bsdcpio-core.wasm \
            bsdcat-core.js bsdcat-core.wasm \
            bsdunzip-core.js bsdunzip-core.wasm \
            manifest.json features.json -d "$dest"
          cp builders/libarchive/runtime/browser-libarchive.js "$dest/browser-libarchive.js"
          echo "[OK] staged libarchive ${version} ${tag}"


      - name: Stage published ImageMagick release for Playground
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source builders/imagemagick/versions.env
          tag="imagemagick-v${BUILDER_VERSION}"
          version="${IMAGEMAGICK_REF}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "[WARN] ${tag} is not published yet; ImageMagick Playground assets will be staged after the release workflow completes."
            exit 0
          fi
          work="${RUNNER_TEMP}/wasm-zoo-pages-imagemagick"
          rm -rf "$work" && mkdir -p "$work"
          asset="imagemagick-browser-full-${version}-zoo-${BUILDER_VERSION}.zip"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$work"
          dest="site/assets/imagemagick/${version}/browser-full"
          mkdir -p "$dest"
          unzip -q -j "$work/$asset" magick-core.js magick-core.wasm manifest.json features.json -d "$dest"
          cp builders/imagemagick/runtime/browser-imagemagick.js "$dest/browser-imagemagick.js"
          echo "[OK] staged ImageMagick ${version} ${tag}"

      - name: Stage published libvips release for Playground
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source builders/libvips/versions.env
          tag="libvips-v${BUILDER_VERSION}"
          version="${LIBVIPS_REF#v}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "[WARN] ${tag} is not published yet; libvips Playground assets will be staged after the release workflow completes."
            exit 0
          fi
          work="${RUNNER_TEMP}/wasm-zoo-pages-libvips"
          rm -rf "$work" && mkdir -p "$work"
          for profile in browser-core browser-full; do
            asset="libvips-${profile}-${version}-zoo-${BUILDER_VERSION}.zip"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$work"
            dest="site/assets/libvips/${version}/${profile}"
            mkdir -p "$dest"
            unzip -q -j "$work/$asset" vips.js vips.wasm vips.d.ts manifest.json features.json versions.json -d "$dest"
            cp builders/libvips/runtime/browser-libvips.js "$dest/browser-libvips.js"
            echo "[OK] staged libvips ${version} ${profile} ${tag}"
          done

      - name: Stage published Ghostscript release for Playground
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source builders/ghostscript/versions.env
          tag="ghostscript-v${BUILDER_VERSION}"
          version="${GHOSTSCRIPT_VERSION}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "[WARN] ${tag} is not published yet; Ghostscript Playground assets will be staged after the release workflow completes."
            exit 0
          fi
          work="${RUNNER_TEMP}/wasm-zoo-pages-ghostscript"
          rm -rf "$work" && mkdir -p "$work"
          asset="ghostscript-browser-full-${version}-zoo-${BUILDER_VERSION}.zip"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$work"
          dest="site/assets/ghostscript/${version}/browser-full"
          mkdir -p "$dest"
          unzip -q -j "$work/$asset" gs-core.js gs-core.wasm manifest.json features.json -d "$dest"
          cp builders/ghostscript/runtime/browser-ghostscript.js "$dest/browser-ghostscript.js"
          echo "[OK] staged Ghostscript ${version} ${tag}"

      - name: Stage published jq release for Playground
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source builders/jq/versions.env
          tag="jq-v${BUILDER_VERSION}"
          version="${JQ_REF#jq-}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "[WARN] ${tag} is not published yet; jq Playground assets will be staged after the release workflow completes."
            exit 0
          fi
          work="${RUNNER_TEMP}/wasm-zoo-pages-jq"
          rm -rf "$work" && mkdir -p "$work"
          asset="jq-browser-full-${version}-zoo-${BUILDER_VERSION}.zip"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$work"
          dest="site/assets/jq/${version}/browser-full"
          mkdir -p "$dest"
          unzip -q -j "$work/$asset" jq-core.js jq-core.wasm manifest.json features.json -d "$dest"
          cp builders/jq/runtime/browser-jq.js "$dest/browser-jq.js"
          echo "[OK] staged jq ${version} ${tag}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
