name: Build experimental Zstandard browser WASM

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "builders/zstd/**"
      - "packages/zstd/**"
      - ".github/workflows/build-zstd.yml"
      - "scripts/generate-build-metadata.mjs"
  push:
    branches: [main]
    paths:
      - "builders/zstd/**"
      - "packages/zstd/**"
      - ".github/workflows/build-zstd.yml"

permissions:
  contents: read

jobs:
  build:
    name: Zstandard ${{ matrix.profile }} / Chromium real operation
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        profile: [browser-core, browser-full]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2.2.0
      - name: Install native zstd for mandatory two-way CLI frame interoperability
        if: matrix.profile == 'browser-full'
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          zstd --version
      - name: Check shell, JavaScript, pins and conservative canary metadata
        run: |
          bash -n builders/zstd/build.sh builders/zstd/scripts/*.sh
          node builders/zstd/scripts/check-repository.mjs
      - name: Compile pinned upstream Zstandard and run the real browser test
        shell: bash
        working-directory: builders/zstd
        env:
          ZSTD_WASM_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
          ZSTD_NATIVE_INTEROP: ${{ matrix.profile == 'browser-full' && 'required' || '' }}
        run: |
          chmod +x ./build.sh ./scripts/*.sh
          ./build.sh '${{ matrix.profile }}'
      - name: Validate experimental profile manifest and supply-chain evidence
        run: |
          node -e '
            const fs=require("node:fs");
            const id=process.argv[1], base="builders/zstd/dist/"+id+"/";
            const env=Object.fromEntries(fs.readFileSync("builders/zstd/versions.env","utf8")
              .split(/\r?\n/).filter(line=>/^[A-Z_]+=/.test(line)).map(line=>{const i=line.indexOf("=");return[line.slice(0,i),line.slice(i+1)];}));
            const manifest=JSON.parse(fs.readFileSync(base+"manifest.json","utf8"));
            if(manifest.profile!==id || manifest.upstream?.version!==env.ZSTD_REF.replace(/^v/,"") ||
               manifest.upstream?.ref!==env.ZSTD_REF || manifest.upstream?.commit!==env.ZSTD_COMMIT ||
               manifest.build?.builderVersion!==env.BUILDER_VERSION) {
              throw new Error("CI artifact provenance/profile disagrees with reviewed source pin");
            }
            for(const f of ["provenance.json","sbom.cdx.json","features.json"]) {
              if(!fs.statSync(base+f).size) throw new Error("Missing "+f);
            }
            const provenance=JSON.parse(fs.readFileSync(base+"provenance.json","utf8"));
            const sbom=JSON.parse(fs.readFileSync(base+"sbom.cdx.json","utf8"));
            const params=provenance.predicate?.buildDefinition?.externalParameters||{};
            if(params.upstreamVersion!==manifest.upstream.version ||
               params.upstreamRef!==manifest.upstream.ref ||
               params.builderVersion!==manifest.build.builderVersion ||
               sbom.metadata?.component?.version!==manifest.upstream.version ||
               !sbom.metadata?.component?.properties?.some(p=>p.name==="wasm-zoo:builder-version" && p.value===manifest.build.builderVersion)) {
              throw new Error("Candidate provenance/SBOM does not describe the actual manifest build identity");
            }
            console.log("[OK] experimental "+id+" exact upstream version and supply-chain metadata");
          ' '${{ matrix.profile }}'
      - name: Upload experimental build artifact (not a release)
        uses: actions/upload-artifact@v7
        with:
          name: experimental-zstd-${{ matrix.profile }}-${{ github.sha }}
          path: |
            builders/zstd/dist/${{ matrix.profile }}/*.js
            builders/zstd/dist/${{ matrix.profile }}/*.mjs
            builders/zstd/dist/${{ matrix.profile }}/*.wasm
            builders/zstd/dist/${{ matrix.profile }}/*.gz
            builders/zstd/dist/${{ matrix.profile }}/manifest.json
            builders/zstd/dist/${{ matrix.profile }}/features.json
            builders/zstd/dist/${{ matrix.profile }}/provenance.json
            builders/zstd/dist/${{ matrix.profile }}/sbom.cdx.json
            builders/zstd/dist/${{ matrix.profile }}/BUILDINFO.txt
            builders/zstd/dist/${{ matrix.profile }}/LICENSE-zstd.txt
          retention-days: 30
          if-no-files-found: error

  package:
    name: Verify corresponding-source release bundle (never publish)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install ZIP tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip
      - name: Download reviewed browser-core build
        uses: actions/download-artifact@v7
        with:
          name: experimental-zstd-browser-core-${{ github.sha }}
          path: builders/zstd/dist/browser-core
      - name: Download reviewed browser-full build
        uses: actions/download-artifact@v7
        with:
          name: experimental-zstd-browser-full-${{ github.sha }}
          path: builders/zstd/dist/browser-full
      - name: Verify both builds and prepare all release assets (no GitHub Release)
        shell: bash
        working-directory: builders/zstd
        run: |
          chmod +x ./scripts/prepare-release.sh
          ./scripts/prepare-release.sh
      - name: Set up Chrome for real Playground UI check
        uses: browser-actions/setup-chrome@v2.2.0
        id: chrome
      - name: Rehearse staged binary hashes and actual Playground UI locally
        shell: bash
        env:
          ZSTD_WASM_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          source builders/zstd/versions.env
          version="${ZSTD_REF#v}"
          for profile in browser-core browser-full; do
            dest="site/assets/zstd/${version}/${profile}"
            mkdir -p "$dest"
            asset="builders/zstd/release/zstd-${profile}-${version}-zoo-${BUILDER_VERSION}.zip"
            if [[ "$profile" = browser-core ]]; then
              unzip -q -j "$asset" zstd-core.js zstd-core.wasm manifest.json features.json \
                browser-zstd.js browser-zstd-worker.js wasm-zoo.mjs -d "$dest"
            else
              unzip -q -j "$asset" zstd-cli.js zstd-cli.wasm manifest.json features.json \
                browser-zstd-cli.js browser-zstd-cli-worker.js wasm-zoo-cli.mjs -d "$dest"
            fi
          done
          node scripts/verify-staged-zstd.mjs
          node -e '
            const fs=require("node:fs");
            const env=Object.fromEntries(fs.readFileSync("builders/zstd/versions.env","utf8")
              .split(/\r?\n/).filter(s=>/^[A-Z_]+=/.test(s)).map(s=>{const i=s.indexOf("=");return[s.slice(0,i),s.slice(i+1)];}));
            fs.writeFileSync("site/zstd-playground/release-status.json",JSON.stringify({
              schemaVersion:1,state:"local-preview",tag:"zstd-v"+env.BUILDER_VERSION,
              upstreamCommit:env.ZSTD_COMMIT
            },null,2)+"\n");
          '
          node scripts/smoke-zstd-playground.mjs
      - name: Upload candidate release bundle for manual review only
        uses: actions/upload-artifact@v7
        with:
          name: experimental-zstd-release-bundle-${{ github.sha }}
          path: builders/zstd/release/*
          if-no-files-found: error
          retention-days: 30
